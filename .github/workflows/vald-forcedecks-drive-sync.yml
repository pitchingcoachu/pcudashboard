name: VALD ForceDecks Drive Sync

on:
  schedule:
    # Recovery/archive pass at 6:30 PM Arizona, after the 6:00 PM API pull.
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: vald-forcedecks-drive-sync
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.PCU_VALD_DRIVE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          workload_identity_provider: projects/207334368088/locations/global/workloadIdentityPools/github-actions/providers/pcu-dashboard
          service_account: pcu-drive-sync@pearl-player-development.iam.gserviceaccount.com

      - name: Import new VALD ForceDecks result exports
        env:
          DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_DRIVE_VALD_FORCEDECKS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_VALD_FORCEDECKS_FOLDER_ID }}
          VALD_FORCEDECKS_ORGANIZATION_ID: "1"
          VALD_FORCEDECKS_SCHOOL_CODE: PCU
          VALD_FORCEDECKS_UTC_OFFSET: "-07:00"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/sync-vald-forcedecks-google-drive.mjs
