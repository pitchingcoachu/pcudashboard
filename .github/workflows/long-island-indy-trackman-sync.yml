name: Long Island and INDY TrackMan Sync

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 12 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional start date (YYYY-MM-DD)"
        required: false
      end_date:
        description: "Optional end date (YYYY-MM-DD)"
        required: false
      lookback_days:
        description: "Days to scan when start_date is omitted"
        required: false
        default: "7"

concurrency:
  group: long-island-indy-trackman-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DASHBOARD_DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
      TRACKMAN_FTP_HOST: ftp.trackmanbaseball.com
      TRACKMAN_V3_FTP_USER: ${{ secrets.LONG_ISLAND_DUCKS_TRACKMAN_FTP_USER }}
      TRACKMAN_V3_FTP_PASSWORD: ${{ secrets.LONG_ISLAND_DUCKS_TRACKMAN_FTP_PASSWORD }}
      TRACKMAN_FTP_DOWNLOAD_WORKERS: "12"

    steps:
      - name: Check out pcudashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dashboard_api/requirements.txt

      - name: Install Python dependencies
        run: pip install -r dashboard_api/requirements.txt

      - name: Resolve date window
        shell: bash
        env:
          INPUT_START_DATE: ${{ github.event.inputs.start_date }}
          INPUT_END_DATE: ${{ github.event.inputs.end_date }}
          INPUT_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          LOOKBACK_DAYS="${INPUT_LOOKBACK_DAYS:-7}"
          END_DATE="${INPUT_END_DATE:-$(date -u +%F)}"
          if [[ -n "${INPUT_START_DATE}" ]]; then
            START_DATE="${INPUT_START_DATE}"
          else
            START_DATE="$(date -u -d "${END_DATE} - $((LOOKBACK_DAYS - 1)) days" +%F)"
          fi
          echo "SYNC_START_DATE=${START_DATE}" >> "$GITHUB_ENV"
          echo "SYNC_END_DATE=${END_DATE}" >> "$GITHUB_ENV"
          echo "ROLLUP_START_DATE=$(date -u -d "${START_DATE} - 1 day" +%F)" >> "$GITHUB_ENV"

      - name: Sync Long Island Ducks games
        run: |
          python scripts/sync_college_trackman_ftp.py \
            --school LI \
            --source v3 \
            --preseason-team-marker POR_TAM \
            --preseason-team-marker CAN_BLA2 \
            --preseason-team-marker TEA_CAL \
            --preseason-team-marker CAL_CAL1 \
            --preseason-team-marker BLA_SOX21 \
            --start-date "${SYNC_START_DATE}" \
            --end-date "${SYNC_END_DATE}"

      - name: Sync Atlantic League aggregate
        run: |
          python scripts/sync_college_trackman_ftp.py \
            --school INDY \
            --source v3 \
            --team-marker LI \
            --team-marker HAG_FLY \
            --team-marker YOR \
            --team-marker LAN \
            --team-marker WES_POW \
            --team-marker GAS \
            --team-marker STA_YAN \
            --team-marker LEX_LEG \
            --team-marker HP \
            --team-marker SMD \
            --require-both-team-markers \
            --minimum-session-date 2026-04-21 \
            --start-date "${SYNC_START_DATE}" \
            --end-date "${SYNC_END_DATE}"

      - name: Refresh Ducks dashboard rollups
        run: |
          python scripts/refresh_college_rollups.py \
            --school LI \
            --window-start "${ROLLUP_START_DATE}" \
            --window-end "${SYNC_END_DATE}" \
            --keep-pooler \
            --batch-days 1 \
            --retries 30

      - name: Refresh INDY dashboard rollups
        run: |
          python scripts/refresh_college_rollups.py \
            --school INDY \
            --window-start "${ROLLUP_START_DATE}" \
            --window-end "${SYNC_END_DATE}" \
            --keep-pooler \
            --batch-days 1 \
            --retries 30

