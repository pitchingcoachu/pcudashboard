name: UNM TrackMan Sync

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 12 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional start date (YYYY-MM-DD)"
        required: false
      end_date:
        description: "Optional end date (YYYY-MM-DD)"
        required: false
      lookback_days:
        description: "Days to scan when start_date is omitted"
        required: false
        default: "7"

concurrency:
  group: unm-trackman-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DASHBOARD_DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
      TRACKMAN_FTP_HOST: ftp.trackmanbaseball.com
      TRACKMAN_PRACTICE_FTP_USER: ${{ secrets.TRACKMAN_PRACTICE_FTP_USER }}
      TRACKMAN_PRACTICE_FTP_PASSWORD: ${{ secrets.TRACKMAN_PRACTICE_FTP_PASSWORD }}
      TRACKMAN_V3_FTP_USER: ${{ secrets.TRACKMAN_V3_FTP_USER }}
      TRACKMAN_V3_FTP_PASSWORD: ${{ secrets.TRACKMAN_V3_FTP_PASSWORD }}
      TM_CLIENT_ID: ${{ secrets.TM_CLIENT_ID }}
      TM_CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}
      TM_LOOKBACK_DAYS: ${{ secrets.TM_LOOKBACK_DAYS }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      CLOUDINARY_FOLDER: trackman

    steps:
      - name: Check out pcudashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dashboard_api/requirements.txt

      - name: Install Python dependencies
        run: pip install -r dashboard_api/requirements.txt

      - name: Resolve date window
        shell: bash
        env:
          INPUT_START_DATE: ${{ github.event.inputs.start_date }}
          INPUT_END_DATE: ${{ github.event.inputs.end_date }}
          INPUT_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          LOOKBACK_DAYS="${INPUT_LOOKBACK_DAYS:-7}"
          END_DATE="${INPUT_END_DATE:-$(date -u +%F)}"
          if [[ -n "${INPUT_START_DATE}" ]]; then
            START_DATE="${INPUT_START_DATE}"
          else
            START_DATE="$(date -u -d "${END_DATE} - $((LOOKBACK_DAYS - 1)) days" +%F)"
          fi
          echo "SYNC_START_DATE=${START_DATE}" >> "$GITHUB_ENV"
          echo "SYNC_END_DATE=${END_DATE}" >> "$GITHUB_ENV"
          echo "SYNC_LOOKBACK_DAYS=${LOOKBACK_DAYS}" >> "$GITHUB_ENV"
          # TrackMan can publish a session CSV in the following day's FTP
          # directory (for example, an Aug 20 session under /Aug/21/CSV).
          # Refresh one extra source-data day so newly ingested backdated
          # sessions cannot be omitted from the dashboard rollups.
          ROLLUP_START_DATE="$(date -u -d "${START_DATE} - 1 day" +%F)"
          echo "ROLLUP_START_DATE=${ROLLUP_START_DATE}" >> "$GITHUB_ENV"

      - name: Sync UNM TrackMan pitch data
        shell: bash
        run: |
          ARGS=(
            --school UNM
            --team-marker UNL_REB
            --team-marker MEX_LOB
            --lookback-days "${SYNC_LOOKBACK_DAYS}"
          )
          ARGS+=(--start-date "${SYNC_START_DATE}" --end-date "${SYNC_END_DATE}")
          python scripts/sync_college_trackman_ftp.py "${ARGS[@]}"

      - name: Sync UNM TrackMan videos
        shell: bash
        run: |
          python scripts/sync_trackman_media.py \
            --school UNM \
            --environment practice \
            --start-date "${SYNC_START_DATE}" \
            --end-date "${SYNC_END_DATE}"

      - name: Refresh UNM dashboard rollups
        shell: bash
        run: |
          # The shared league rollup can legitimately hold its advisory lock for
          # several minutes. Keep retrying long enough for that rebuild to finish.
          ARGS=(--school UNM --keep-pooler --batch-days 1 --retries 30)
          ARGS+=(--window-start "${ROLLUP_START_DATE}" --window-end "${SYNC_END_DATE}")
          python scripts/refresh_college_rollups.py "${ARGS[@]}"
