name: Force Plate Sync

on:
  schedule:
    # 6:00 PM Arizona (MST, UTC-7) every day.
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull complete five-day ForceDecks results
        env:
          DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
          VALD_CLIENT_ID: ${{ secrets.VALD_CLIENT_ID }}
          VALD_CLIENT_SECRET: ${{ secrets.VALD_CLIENT_SECRET }}
          VALD_FORCEDECKS_TENANT_ID: ${{ secrets.VALD_FORCEDECKS_TENANT_ID }}
          VALD_REGION: ${{ secrets.VALD_REGION }}
          FORCE_PLATE_SYNC_ORGANIZATION_ID: "1"
          FORCE_PLATE_SYNC_SCHOOL_CODE: PCU
          FORCE_PLATE_SYNC_DAILY_LOOKBACK_DAYS: "5"
          FORCE_PLATE_SYNC_MAX_RUN_SECONDS: "3300"
          VALD_TRIAL_FETCH_CONCURRENCY: "4"
          VALD_REQUEST_TIMEOUT_MS: "30000"
          VALD_REQUEST_MAX_ATTEMPTS: "4"
        run: npx --no-install tsx scripts/sync-vald-forcedecks-api.ts
