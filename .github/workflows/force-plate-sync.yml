name: Force Plate Sync

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger force plate sync endpoint
        env:
          FORCE_PLATE_SYNC_URL: ${{ secrets.FORCE_PLATE_SYNC_URL }}
          FORCE_PLATE_SYNC_CRON_KEY: ${{ secrets.FORCE_PLATE_SYNC_CRON_KEY }}
        run: |
          if [ -z "$FORCE_PLATE_SYNC_URL" ]; then
            echo "FORCE_PLATE_SYNC_URL secret is missing"
            exit 1
          fi
          if [ -z "$FORCE_PLATE_SYNC_CRON_KEY" ]; then
            echo "FORCE_PLATE_SYNC_CRON_KEY secret is missing"
            exit 1
          fi
          SYNC_URL="$FORCE_PLATE_SYNC_URL"
          SYNC_PARAMS="async=1&playerBatchSize=12&maxRunSeconds=240&lookbackDays=45&testsWindowDays=3&recentTestLimit=500&trialFetchLimit=0&requestTimeoutMs=15000&requestMaxAttempts=3"
          case "$SYNC_URL" in
            *\?*) SYNC_URL="${SYNC_URL}&${SYNC_PARAMS}" ;;
            *) SYNC_URL="${SYNC_URL}?${SYNC_PARAMS}" ;;
          esac
          curl -fsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 20 -X GET "$SYNC_URL" \
            -H "Authorization: Bearer $FORCE_PLATE_SYNC_CRON_KEY" \
            -H "x-cron-key: $FORCE_PLATE_SYNC_CRON_KEY" \
            -H "Accept: application/json"
