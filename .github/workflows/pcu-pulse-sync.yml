name: PCU PULSE Sync

on:
  schedule:
    - cron: "0 17 * * *"
      timezone: "America/Phoenix"
  workflow_dispatch:

concurrency:
  group: pcu-pulse-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.PCU_PULSE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PCU_PULSE_USERNAME: ${{ secrets.PCU_PULSE_USERNAME }}
      PCU_PULSE_PASSWORD: ${{ secrets.PCU_PULSE_PASSWORD }}
      PCU_PULSE_EXPORT_EMAIL: ${{ secrets.PCU_PULSE_EXPORT_EMAIL }}
      GMAIL_CLIENT_ID: ${{ secrets.PCU_GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.PCU_GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.PCU_GMAIL_REFRESH_TOKEN }}
      PCU_PULSE_SYNC_TOKEN: ${{ secrets.PCU_PULSE_SYNC_TOKEN }}
      PULSE_IMPORT_URL: https://www.pcudashboard.com/api/automation/pcu-pulse

    steps:
      - name: Check out pcudashboard
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Request, download, and import PCU PULSE exports
        run: node scripts/sync-pcu-pulse.mjs
