name: PRO Sync

on:
  schedule:
    # PT schedule requested (5:00, 9:00) represented in UTC.
    # Note: GitHub cron is UTC and will shift by 1 hour across DST changes.
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "YYYY-MM-DD (optional)"
        required: false
      end_date:
        description: "YYYY-MM-DD (optional)"
        required: false

concurrency:
  group: pro-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DASHBOARD_DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
      PRO_SYNC_LOOKBACK_DAYS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r dashboard_api/requirements.txt

      - name: Resolve sync date range
        shell: bash
        run: |
          END_DATE="${{ github.event.inputs.end_date }}"
          START_DATE="${{ github.event.inputs.start_date }}"
          if [[ -z "${END_DATE}" ]]; then
            END_DATE="$(date -u +%F)"
          fi
          if [[ -z "${START_DATE}" ]]; then
            START_DATE="$(date -u -d "${PRO_SYNC_LOOKBACK_DAYS} days ago" +%F)"
          fi
          echo "START_DATE=${START_DATE}" >> "$GITHUB_ENV"
          echo "END_DATE=${END_DATE}" >> "$GITHUB_ENV"
          echo "Syncing PRO data from ${START_DATE} to ${END_DATE}"

      - name: Run MLB StatsAPI sync (MLB)
        shell: bash
        run: |
          python scripts/sync_pro_mlb_stats.py \
            --start-date "${START_DATE}" \
            --end-date "${END_DATE}" \
            --sport-ids 1 \
            --sleep-ms 120

      - name: Run MLB StatsAPI sync (AAA full)
        shell: bash
        run: |
          python scripts/sync_pro_mlb_stats.py \
            --start-date "${START_DATE}" \
            --end-date "${END_DATE}" \
            --sport-ids 11 \
            --sleep-ms 120

      - name: Download Savant CSV (MLB + MiLB)
        shell: bash
        run: |
          python scripts/download_pro_savant_csv.py \
            --start-date "${START_DATE}" \
            --end-date "${END_DATE}"

      - name: Enrich from Savant CSV
        shell: bash
        run: |
          PATHS=()
          cur="${START_DATE}"
          while [[ "${cur}" < "${END_DATE}" || "${cur}" == "${END_DATE}" ]]; do
            mlb="data/pro_savant_raw/mlb/savant_mlb_${cur}.csv"
            milb="data/pro_savant_raw/milb/savant_milb_${cur}.csv"
            [[ -f "${mlb}" ]] && PATHS+=("${mlb}")
            [[ -f "${milb}" ]] && PATHS+=("${milb}")
            cur="$(date -u -d "${cur} + 1 day" +%F)"
          done
          if (( ${#PATHS[@]} == 0 )); then
            echo "No Savant CSV files found for date range. Skipping."
            exit 0
          fi
          python scripts/sync_pro_savant_csv.py --paths "${PATHS[@]}"
