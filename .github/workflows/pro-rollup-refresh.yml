name: PRO Rollup Refresh

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Run a full PRO rollup rebuild instead of an incremental refresh"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: pro-rollup-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DASHBOARD_DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r dashboard_api/requirements.txt

      - name: Refresh PRO rollups
        run: |
          if [[ "${{ inputs.full_rebuild }}" == "true" ]]; then
            python scripts/refresh_pro_rollups.py --force
          else
            python scripts/refresh_pro_rollups.py --incremental
          fi
