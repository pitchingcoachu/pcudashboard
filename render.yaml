services:
  - type: web
    name: pcudashboard-api
    env: python
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install -r dashboard_api/requirements.txt
    startCommand: python -m uvicorn dashboard_api.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    postDeployCommand: python scripts/refresh_college_rollups.py --school LEAGUE
    healthCheckPath: /health
  - type: cron
    name: pcudashboard-league-rollup-refresh
    env: python
    plan: starter
    branch: main
    schedule: "*/30 * * * *"
    buildCommand: pip install -r dashboard_api/requirements.txt
    startCommand: python scripts/refresh_college_rollups.py --school LEAGUE
