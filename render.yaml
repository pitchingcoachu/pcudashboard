services:
  - type: web
    name: pcudashboard-api
    env: python
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install -r dashboard_api/requirements.txt
    startCommand: python -m uvicorn dashboard_api.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
